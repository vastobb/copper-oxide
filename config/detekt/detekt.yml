# Detekt configuration for Copper Oxide (detekt 1.23)
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
  UnnecessaryAbstractClass:
    active: false
  ReturnCount:
    max: 5

naming:
  FunctionNaming:
    active: false
  MemberNameEqualsClassName:
    active: false

complexity:
  CyclomaticComplexMethod:
    threshold: 20
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 9
  NestedBlockDepth:
    threshold: 5

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

performance:
  SpreadOperator:
    active: false

build:
  maxIssues: 0
  weights:
    complexity: 2
