name: CI/CD - Copper Oxide Renderer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true"

jobs:
  # Lint and static analysis
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # spotlessApply normalizes the checked-in sources; the check after it
      # guarantees the formatter itself is happy with the result.
      - name: Run spotless
        run: ./gradlew spotlessApply spotlessCheck --no-daemon

      - name: Run detekt
        run: ./gradlew detekt --no-daemon

      - name: Run Android Lint
        run: ./gradlew lint --no-daemon

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 7

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # Native build
  native-build:
    name: Native Build (C++)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libvulkan-dev \
            vulkan-tools \
            spirv-tools \
            glslang-tools

      - name: Setup Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.2.12479018 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Configure CMake
        run: |
          cd app/src/main/cpp
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build native library
        run: |
          cd app/src/main/cpp/build
          ninja -j$(nproc)

      - name: Verify library
        run: |
          set -euo pipefail
          # The library is located rather than assumed. Hard-coding a path here is
          # what let the library be absent from every APK while this step still
          # passed, because the path it asserted came from a CMake override that
          # sent the .so somewhere AGP does not package from.
          # This job drives CMake directly, so the output lands in
          # app/src/main/cpp/build rather than in AGP's cxx intermediates. Both
          # locations are searched so the check does not depend on which of them
          # produced the library.
          mapfile -t libs < <(find app -name 'libcopper-oxide.so' -type f | sort)
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::error::libcopper-oxide.so was not produced by the native build"
            exit 1
          fi
          printf 'found %s native librar(y/ies):\n' "${#libs[@]}"
          printf '  %s\n' "${libs[@]}"
          file "${libs[@]}"
          # A library with no exported JNI_OnLoad would load but fail every call.
          for lib in "${libs[@]}"; do
            if ! readelf -a "$lib" 2>/dev/null | grep -q 'JNI_OnLoad'; then
              echo "::error::$lib exports no JNI_OnLoad"
              exit 1
            fi
          done

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-lib
          path: |
            app/src/main/cpp/build/libcopper-oxide.so
          retention-days: 7
          if-no-files-found: error

  # Android build
  android-build:
    name: Android Build (APK/AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, unit-tests, native-build]
    strategy:
      matrix:
        build_type: [release, debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'
          accept-android-sdk-licenses: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assemble${{ matrix.build_type == 'release' && 'Release' || 'Debug' }} --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" ! -path '*androidTest*' | head -1)
          echo "APK: $APK_PATH"
          ls -la "$APK_PATH"
          unzip -l "$APK_PATH" | head -30
          # The library actually being inside the APK is the only check that
          # proves System.loadLibrary will work. Listing the archive is not
          # enough: this exact class of bug shipped every APK without the .so.
          if ! unzip -l "$APK_PATH" | grep -q 'lib/arm64-v8a/libcopper-oxide.so'; then
            echo "::error::$APK_PATH does not contain lib/arm64-v8a/libcopper-oxide.so"
            exit 1
          fi
          unzip -l "$APK_PATH" | grep 'libcopper-oxide.so'
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            if ! unzip -l "$APK_PATH" | grep -q 'lib/x86_64/libcopper-oxide.so'; then
              echo "::error::the debug APK must carry x86_64 too, or CI emulators cannot load it"
              exit 1
            fi
          fi

      - name: Build androidTest APK
        if: matrix.build_type == 'debug'
        run: ./gradlew assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Verify androidTest APK
        if: matrix.build_type == 'debug'
        run: |
          set -euo pipefail
          TEST_APK=$(find app/build/outputs/apk/androidTest -name "*.apk" | head -1)
          if [ -z "$TEST_APK" ]; then
            echo "::error::no androidTest APK was produced"
            exit 1
          fi
          echo "androidTest APK: $TEST_APK"
          ls -la "$TEST_APK"
          # An instrumentation APK deliberately carries no native libraries: the
          # library under test lives in the app APK, which was checked above. So
          # this verifies that the test code itself is present, which is what an
          # empty or stale classes.dex would break.
          unzip -l "$TEST_APK" | grep -E 'classes.dex|AndroidManifest.xml'
          if ! unzip -l "$TEST_APK" | grep -q 'classes.dex'; then
            echo "::error::the androidTest APK has no classes.dex; the tests are not packaged"
            exit 1
          fi

      - name: Upload androidTest APK
        if: matrix.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7

      - name: Build AAB (release only)
        if: matrix.build_type == 'release'
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.build_type }}
          path: app/build/outputs/apk/${{ matrix.build_type }}/*.apk
          retention-days: 30

      - name: Upload AAB
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload mapping file
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

  # Instrumented tests (emulator)
  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [android-build]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'
          accept-android-sdk-licenses: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/

      - name: Download androidTest APK
        uses: actions/download-artifact@v4
        with:
          name: androidtest-apk
          path: app/build/outputs/apk/androidTest/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulators run the x86_64 ABI of the app, so CI builds both ABIs.
      # KVM is enabled above, so hardware acceleration is used for the guest.
      - name: Start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          disable-linux-hw-accel: false
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: |
            adb install -r -t app/build/outputs/apk/androidTest/debug/*.apk
            adb install -r -t app/build/outputs/apk/debug/*.apk
            adb logcat -c || true
            adb shell am instrument -w com.oxide.mc.copperoxide.test/androidx.test.runner.AndroidJUnitRunner | tee instrumented-tests.log
            # The renderer's own logging is the only way to tell a driver that
            # refuses to initialise from one that initialises and draws nothing.
            adb logcat -d -v brief '*:S' CopperOxide:V CopperOxide-JNI:V CopperOxide-Base:V libc:V DEBUG:V AndroidRuntime:E | tee instrumented-logcat.txt || true
            # `am instrument` reports failures in its output but still exits 0, so
            # a green job meant nothing. Fail on the two markers that actually
            # distinguish a run: JUnit prints FAILURES!!! or "OK (n tests)".
            if grep -q 'FAILURES!!!' instrumented-tests.log; then
              echo "::error::instrumented tests reported failures"
              exit 1
            fi
            if ! grep -qE '^OK \([0-9]+ tests?\)' instrumented-tests.log; then
              echo "::error::instrumented tests did not report a successful run"
              exit 1
            fi
            grep -E 'Tests run:|OK \(' instrumented-tests.log || true

      - name: Upload renderer logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-logcat
          path: instrumented-logcat.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/
          retention-days: 7

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Copper Oxide'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
          retention-days: 7

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts/apk/

      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: artifacts/aab/

      - name: Download mapping file
        uses: actions/download-artifact@v4
        with:
          name: mapping-release
          path: artifacts/mapping/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" $PREV..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Copper Oxide ${{ steps.version.outputs.VERSION }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Downloads
            - **APK**: \`copper-oxide-${{ steps.version.outputs.VERSION }}-release.apk\`
            - **AAB**: \`copper-oxide-${{ steps.version.outputs.VERSION }}-release.aab\`

            ## Installation
            1. Download the APK for your architecture (ARM64)
            2. Install on Android device (enable "Install from unknown sources")
            3. Grant storage permissions for shader/mod cache

            ## Requirements
            - Android 8.0+ (API 26)
            - ARM64 device (arm64-v8a)
            - Vulkan 1.1+ or OpenGL ES 3.0+ support

            ## Renderer Backends
            - **Vulkan** (preferred): Adreno 600+/700+/800, Mali Valhall/G715
            - **OpenGL ES 3.2**: Fallback for older devices

          files: |
            artifacts/apk/*.apk
            artifacts/aab/*.aab
            artifacts/mapping/mapping.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: false

      - name: Publish to GitHub Packages (AAB)
        if: false
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.oxide.mc.copperoxide
          releaseFiles: artifacts/aab/*.aab
          track: internal
          status: draft

  # Benchmark
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [android-build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'
          accept-android-sdk-licenses: true

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/

      - name: Run benchmarks
        run: |
          echo "Benchmark job - would run on device farm"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 30

  # Notify
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, unit-tests, native-build, android-build, instrumented-tests, security, release]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "All jobs completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Native build: ${{ needs.native-build.result }}"
          echo "Android build: ${{ needs.android-build.result }}"
          echo "Instrumented tests: ${{ needs.instrumented-tests.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Release: ${{ needs.release.result }}"

      - name: Send failure notification
        if: failure()
        run: |
          echo "Build failed - would send notification"